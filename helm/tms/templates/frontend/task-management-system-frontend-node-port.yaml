apiVersion: v1
kind: Service
metadata:
  name: task-management-system-frontend-node-port
spec:
  selector:
    app: task-management-system-frontend
  ports:
    - protocol: TCP
      port: {{.Values.frontendServiceNodePort.port}}
      targetPort: {{.Values.frontendServiceNodePort.targetPort}}
      nodePort: {{.Values.frontendServiceNodePort.nodePort}}
  type: NodePort
  