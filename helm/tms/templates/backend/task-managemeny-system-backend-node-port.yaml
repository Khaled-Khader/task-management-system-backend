apiVersion: v1
kind: Service
metadata:
  name: task-management-system-backend-node-port
spec:
  selector:
    app: task-management-system-backend
  ports:
    - protocol: TCP
      port: {{.Values.backendServiceNodePort.port}}
      targetPort: {{.Values.backendServiceNodePort.targetPort}}
      nodePort: {{.Values.backendServiceNodePort.nodePort}}
  type: NodePort

