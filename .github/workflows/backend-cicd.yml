
name: Backend CI/CD

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout backend repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify tools
        shell: powershell
        run: |
          java -version
          mvn -version
          docker --version
          helm version
          kubectl config current-context

      - name: Build and test with Maven
        shell: powershell
        run: mvn -B clean verify

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        shell: powershell
        run: |
          docker build -t khaleddd04/task-management-system:${{ github.sha }} .

      - name: Push Docker image
        shell: powershell
        run: |
          docker push khaleddd04/task-management-system:${{ github.sha }}

      - name: Deploy backend with Helm
        shell: powershell
        run: |
          helm upgrade tms ./helm/tms `
            --reuse-values `
            --set-string "backend.image=khaleddd04/task-management-system:${{ github.sha }}" `
            --wait `
            --timeout 5m

      - name: Verify Kubernetes rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/task-management-system-backend --timeout=300s
          kubectl get pods -l app=task-management-system-backend
