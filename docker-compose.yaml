services:

  mysql:
    image: mysql:latest
    container_name: mysql-compose
    ports:
      - "3000:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: khaled
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-compose:
    image: khaleddd04/task-management-system:1.0.0
    container_name: backend-compose
    ports:
      - "8889:8888"
    environment:
      DATA_BASE_URL: jdbc:mysql://mysql:3306/khaled
      DATA_BASE_USER_NAME: root
      DATA_BASE_PASSWORD: root
      ACTIVE_PROFILE: prod
    depends_on:
      mysql:
        condition: service_healthy

  frontend-compose:
    image: khaleddd04/task-management-frontend:1.0.1
    container_name: frontend-compose
    ports:
      - "4200:80"
    depends_on:
      - backend-compose